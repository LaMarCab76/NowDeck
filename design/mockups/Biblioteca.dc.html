<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblioteca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#F2EEE8}a:hover{color:#FFFFFF}
input::placeholder{color:#A39D95}
</style>
</helmet>
<div style="width: 896px; height: 414px; box-sizing: border-box; padding: 28px 48px 10px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; background: #000000; color: #F2EEE8; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 44px">
<div role="tablist" aria-label="Secciones" style="display: flex; align-items: center; gap: 4px; height: 44px; box-sizing: border-box; padding: 4px; margin-left: -4px; border-radius: 22px; background: rgba(255,255,255,0.08)">
<button role="tab" aria-selected="{{bibSelected}}" onClick="{{verBiblioteca}}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{bibBg}}; color: {{bibColor}}; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">Biblioteca</button>
<button role="tab" aria-selected="{{buscarSelected}}" onClick="{{verBuscar}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 18px 0 14px; border: 0; border-radius: 18px; background: {{buscarBg}}; color: {{buscarColor}}; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span>Buscar</span>
</button>
</div>
<a href="https://open.spotify.com" aria-label="Abrir en Spotify" style="flex: none; display: flex; align-items: center; height: 44px; text-decoration: none">
<div style="width: 108px; height: 30px; box-sizing: border-box; border: 1px dashed rgba(255,255,255,0.5); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.06em; color: #C9C4BC">LOGO SPOTIFY</div>
</a>
</div>

<sc-if value="{{enBiblioteca}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 44px">
<div role="group" aria-label="Filtrar biblioteca" style="display: flex; align-items: center; gap: 8px">
<sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
<button aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1.5px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}; font-size: 15px; font-weight: 600; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
<a href="https://open.spotify.com" style="display: flex; align-items: center; gap: 6px; height: 44px; color: #F2EEE8; text-decoration: none; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em">
<span>ABRIR SPOTIFY</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
</a>
</div>

<div style="display: flex; gap: 20px; margin-right: -48px; overflow: hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="6">
<a href="Main.dc.html" style="flex: none; width: 150px; display: flex; flex-direction: column; gap: 10px; color: #F2EEE8; text-decoration: none">
<div aria-hidden="true" style="position: relative; width: 150px; height: 150px; border-radius: 4px; overflow: hidden; background: {{item.bg}}">
<div style="position: absolute; left: {{item.x}}; top: {{item.y}}; width: {{item.s}}; height: {{item.s}}; border-radius: {{item.r}}; background: {{item.fg}}"></div>
</div>
<div style="display: flex; flex-direction: column">
<div style="font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</div>
<div style="font-size: 13px; line-height: 18px; color: #C9C4BC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.sub}}</div>
</div>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{enBuscar}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px; height: 248px">
<div style="display: flex; align-items: center; gap: 12px; height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 28px; background: rgba(255,255,255,0.1)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9C4BC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Buscar en Spotify" placeholder="Temas, artistas, álbumes, podcasts o audiolibros" style="flex: 1 1 0; min-width: 0; height: 56px; border: 0; background: transparent; color: #F2EEE8; font-size: 18px; outline-color: #2FD566">
</div>
<p style="margin: 0; max-width: 520px; font-size: 15px; line-height: 22px; color: #C9C4BC; text-wrap: pretty">Tocá un resultado y empieza a sonar en el dispositivo activo.</p>
</div>
</sc-if>

<div style="display: flex; align-items: center; gap: 8px; height: 56px; box-sizing: border-box; padding: 0 6px 0 8px; border-radius: 14px; background: #34465A">
<a href="Main.dc.html" style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 12px; height: 56px; color: #F2EEE8; text-decoration: none">
<div aria-hidden="true" style="position: relative; flex: none; width: 40px; height: 40px; border-radius: 4px; overflow: hidden; background: #1E3A5C">
<div style="position: absolute; left: 8px; top: 6px; width: 24px; height: 24px; border-radius: 50%; background: #F0A24E"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 13px; background: #0F2238"></div>
</div>
<div style="flex: 1 1 0; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden">
<span style="font-size: 16px; font-weight: 600">Vereda Mojada</span>
<span style="font-size: 14px; color: #C9C4BC; overflow: hidden; text-overflow: ellipsis">Los Tilos del Sur</span>
</div>
</a>
<a href="Dispositivos.dc.html" style="flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; color: #2FD566; text-decoration: none">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="4" y="5" width="16" height="11" rx="1.5"></rect><path d="M2 19h20"></path></svg>
<span style="white-space: nowrap; font-size: 14px; line-height: 20px"><span style="font-weight: 500">Suena en </span><span style="font-weight: 700">MacBook Pro</span></span>
</a>
<button aria-label="Pausar" style="flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: #F2EEE8; color: #000000; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pestana":{"editor":"enum","options":["biblioteca","buscar"],"default":"biblioteca"},"$preview":{"width":896,"height":414}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const tab = s.tab ?? (this.props.pestana ?? 'biblioteca');
const filtro = s.filtro ?? 'playlists';
const datos = {
playlists: [
{ name: 'Para laburar', sub: 'Playlist · 48 temas', bg: '#2F4B3A', fg: '#E9DFC8', x: '58px', y: '22px', s: '120px', r: '50%' },
{ name: 'Asado del domingo', sub: 'Playlist · 112 temas', bg: '#7A2E1F', fg: '#F0A24E', x: '25px', y: '40px', s: '100px', r: '0' },
{ name: 'Ruta 2', sub: 'Playlist · 63 temas', bg: '#1F3F6B', fg: '#E9DFC8', x: '22px', y: '26px', s: '44px', r: '50%' },
{ name: 'Lluvia y mate', sub: 'Playlist · 27 temas', bg: '#3A3552', fg: '#9C92D6', x: '40px', y: '40px', s: '70px', r: '12px' },
{ name: 'Gimnasio', sub: 'Playlist · 35 temas', bg: '#C98A1B', fg: '#2A1A06', x: '40px', y: '40px', s: '70px', r: '0' },
{ name: 'Viernes', sub: 'Playlist · 81 temas', bg: '#40202E', fg: '#D9788F', x: '-30px', y: '60px', s: '120px', r: '50%' }
],
albumes: [
{ name: 'Madrugada en Loop', sub: 'Álbum · Los Tilos del Sur', bg: '#1E3A5C', fg: '#F0A24E', x: '30px', y: '24px', s: '90px', r: '50%' },
{ name: 'Costanera', sub: 'Álbum · Marea Baja', bg: '#0F4C5C', fg: '#9ED8DB', x: '0', y: '80px', s: '150px', r: '0' },
{ name: 'Pequeñas horas', sub: 'Álbum · Inés Varela', bg: '#E9DFC8', fg: '#2B2420', x: '55px', y: '55px', s: '40px', r: '50%' },
{ name: 'Plaza seca', sub: 'Álbum · Grupo Galpón', bg: '#5C3B1E', fg: '#D8A35D', x: '20px', y: '20px', s: '110px', r: '6px' },
{ name: 'Sur de noche', sub: 'Álbum · Los Tilos del Sur', bg: '#101826', fg: '#7CC4FF', x: '90px', y: '18px', s: '36px', r: '50%' }
],
podcasts: [
{ name: 'Charla de pasillo', sub: 'Podcast · Tres amigos', bg: '#D9788F', fg: '#2A0F18', x: '35px', y: '35px', s: '80px', r: '50%' },
{ name: 'Historias del subte', sub: 'Podcast · Crónicas', bg: '#F2C14E', fg: '#1B1B1B', x: '0', y: '62px', s: '150px', r: '0' },
{ name: 'Código abierto', sub: 'Podcast · Tecnología', bg: '#14231C', fg: '#6FCF97', x: '30px', y: '30px', s: '90px', r: '12px' },
{ name: 'Medio tiempo', sub: 'Podcast · Fútbol', bg: '#2E5E3A', fg: '#F2EEE8', x: '50px', y: '50px', s: '50px', r: '50%' }
],
audiolibros: [
{ name: 'El faro del sur', sub: 'Audiolibro · R. Ferreyra', bg: '#24304A', fg: '#F2EEE8', x: '68px', y: '20px', s: '14px', r: '0' },
{ name: 'Cuentos de la siesta', sub: 'Audiolibro · M. Ibarra', bg: '#E7C9A0', fg: '#8C4A2F', x: '-20px', y: '-20px', s: '110px', r: '50%' },
{ name: 'La última parada', sub: 'Audiolibro · J. Quiroga', bg: '#3B1F2B', fg: '#C77D4A', x: '25px', y: '100px', s: '100px', r: '0' }
]
};
const opciones = [['playlists', 'Playlists'], ['albumes', 'Álbumes'], ['podcasts', 'Podcasts'], ['audiolibros', 'Audiolibros']];
const filtros = opciones.map(([id, label]) => {
const on = id === filtro;
return {
label: label,
pressed: on ? 'true' : 'false',
bg: on ? '#F2EEE8' : 'transparent',
color: on ? '#000000' : '#F2EEE8',
border: on ? '#F2EEE8' : 'rgba(255,255,255,0.35)',
pick: () => this.setState({ filtro: id })
};
});
const enBib = tab !== 'buscar';
return {
enBiblioteca: enBib,
enBuscar: !enBib,
verBiblioteca: () => this.setState({ tab: 'biblioteca' }),
verBuscar: () => this.setState({ tab: 'buscar' }),
bibSelected: enBib ? 'true' : 'false',
buscarSelected: enBib ? 'false' : 'true',
bibBg: enBib ? '#F2EEE8' : 'transparent',
bibColor: enBib ? '#000000' : '#F2EEE8',
buscarBg: enBib ? 'transparent' : '#F2EEE8',
buscarColor: enBib ? '#F2EEE8' : '#000000',
filtros: filtros,
items: datos[filtro] || datos.playlists
};
}
}
</script>
</body>
</html>
