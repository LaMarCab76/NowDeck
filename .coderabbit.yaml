# CodeRabbit configuration for Nowdeck.
# Docs: https://docs.coderabbit.ai/reference/configuration
#
# The `main` ruleset on GitHub requires one approval and the `CodeRabbit` check.
# Together with the settings below, a pull request can only be merged once
# CodeRabbit has reviewed its latest commit and approved it.

reviews:
  auto_approvals:
    # Request changes when the review leaves actionable comments; approve once
    # they are resolved on the latest commit. The approval satisfies the
    # "1 required approval" rule of the ruleset.
    enabled: true
    # Lets the PR author post `@coderabbitai approve` on their own PR. Needed while
    # the project has a single maintainer, as the escape hatch when a review is
    # stuck. Merging is still limited to collaborators.
    allow_author_approval: true

  # Report the review as a GitHub check run named `CodeRabbit`.
  review_progress: true
  commit_status: true
  # A review that errors fails the check (and blocks the merge) instead of
  # passing silently. Re-run with `@coderabbitai review`.
  fail_commit_status: true
